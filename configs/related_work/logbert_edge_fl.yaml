simulation_name: "RELATED_LogBERT_Edge_FedAvg_R30"
dataset_name: "edge_ransomware"
description: "LogBERT-style masked LM baseline adapted to the Edge ransomware FL scenario."

data_base_path: "./data/ids_ransomware/"
results_path: "./results_related/"

session_window_spliter: " ;-; "
force_reprocess_data: false
benign_train_fraction: 0.8
benign_calibration_fraction: 0.0
processed_required_files: ["train.csv", "test.csv"]
content_mode: "raw"
tokenized_subdir: "tokenized_logbert_edge_bertbase"

model_name: "bert-base-uncased"
model_family: "masked_lm"
masked_lm: true
lora: false
mlm_probability: 0.65
eval_mask_ratio: 0.65

use_parallel_training: false
num_rounds: 30
num_clients: 50
client_frac: 0.2

data_distribution_strategy: "hetero_device"
non_iid_alpha: 0.5

client_selection_strategy: "data_size_proportional"
use_weighted_aggregation: true

fedprox_mu: 0.0

max_length: 512
eval_max_length: 512
max_steps: 50
batch_size: 8
gradient_accumulation_steps: 1
initial_lr: 0.0001
min_lr: 0.00001
lr_scheduler_type: "cosine"

top_k_values: [1, 3, 5, 6, 10]
f1_threshold_steps: 1000

threshold_selection: "f1_max"

evaluator_version: "new"
accuracy_method: "masked_token_topk"

evaluation_runs:
  - name: "operational_fpr_target_flow"
    overrides:
      evaluation_output_dir: "./results_related/RELATED_LogBERT_Edge_FedAvg_R30/eval_fpr_target_flow"
      threshold_selection: "fpr_target"
      fpr_target: 0.01
      calibration_source: "train_benign"
      calibration_num_samples: 2000
      enable_temporal_metrics: true
      temporal_eval_mode: "flow"
  - name: "operational_fpr_target_window_30s"
    overrides:
      evaluation_output_dir: "./results_related/RELATED_LogBERT_Edge_FedAvg_R30/eval_fpr_target_window30s"
      threshold_selection: "fpr_target"
      fpr_target: 0.01
      calibration_source: "train_benign"
      calibration_num_samples: 2000
      enable_temporal_metrics: true
      temporal_eval_mode: "window"
      temporal_window_seconds: 30
      temporal_window_agg: "mean"
