simulation_name: "SMOKE_LogBERT_Edge_FedAvg_R1"
dataset_name: "edge_ransomware"
description: "Smoke test for the LogBERT-style masked LM baseline on the Edge ransomware FL scenario."

data_base_path: "./data/ids_ransomware/"
results_path: "./results_related/"

session_window_spliter: " ;-; "
force_reprocess_data: false
benign_train_fraction: 0.8
benign_calibration_fraction: 0.0
processed_required_files: ["train.csv", "test.csv"]
content_mode: "raw"
tokenized_subdir: "tokenized_logbert_edge_bertbase_smoke"

model_name: "bert-base-uncased"
model_family: "masked_lm"
masked_lm: true
lora: false
huggingface_note: "Use low_cpu_mem_usage to reduce RAM peaks during repeated model loads."
hf_low_cpu_mem_usage: true
mlm_probability: 0.65
eval_mask_ratio: 0.65

use_parallel_training: false
num_rounds: 1
num_clients: 4
client_frac: 0.5

data_distribution_strategy: "hetero_device"
non_iid_alpha: 0.5

client_selection_strategy: "data_size_proportional"
use_weighted_aggregation: true

fedprox_mu: 0.0

max_length: 512
eval_max_length: 512
max_steps: 1
batch_size: 4
gradient_accumulation_steps: 2
gradient_checkpointing: true
torch_empty_cache_steps: 10
fp16: true
initial_lr: 0.0001
min_lr: 0.00001
lr_scheduler_type: "cosine"

top_k_values: [1, 3, 5, 6, 10]
f1_threshold_steps: 100

threshold_selection: "f1_max"

evaluator_version: "new"
accuracy_method: "masked_token_topk"
